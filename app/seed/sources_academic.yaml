# 学术周报源（第 5 节）。arXiv/PubMed/S2 走 API；期刊走 RSS。
- kind: arxiv
  weight: 1.2
  config:
    name: arXiv cond-mat.mes-hall + bio-ph + app-ph
    categories: [cond-mat.mes-hall, physics.bio-ph, physics.app-ph]
    query: nanopore OR "solid-state nanopore" OR "ionic current"
    max_results: 80
- kind: pubmed
  weight: 1.0
  config:
    name: PubMed/PMC E-utilities
    term: "solid-state nanopore OR nanopore sequencing OR nanopore sensing"
    max_results: 60
- kind: rss
  weight: 0.9
  config:
    name: bioRxiv (biophysics)
    url: https://connect.biorxiv.org/biorxiv_xml.php?subject=biophysics
- kind: s2
  weight: 1.0
  config:
    name: Semantic Scholar 引用图谱
    query: solid-state nanopore
    fields: [title, abstract, year, citationCount, externalIds, url]
    limit: 60

# 期刊 RSS
- kind: rss
  weight: 1.1
  config:
    name: Nature Nanotechnology
    url: https://www.nature.com/nnano.rss
- kind: rss
  weight: 1.1
  config:
    name: Nature Materials
    url: https://www.nature.com/nmat.rss
- kind: rss
  weight: 0.9
  config:
    name: Small
    url: https://onlinelibrary.wiley.com/feed/16136829/most-recent

# ACS 三本走 Crossref：pubs.acs.org 的 RSS 现在挂了 Cloudflare 人机验证
# （403 + "Just a moment..." 挑战页，feedparser 拿到 HTML 解析失败）。
# Crossref 是公开文献元数据 API，拿同样的期刊目录，无需鉴权。用 online ISSN。
- kind: crossref
  weight: 1.0
  config:
    name: ACS Nano (Crossref)
    issn: 1936-086X
    max_results: 40
    days: 30
- kind: crossref
  weight: 1.0
  config:
    name: Nano Letters (Crossref)
    issn: 1530-6992
    max_results: 40
    days: 30
- kind: crossref
  weight: 0.9
  config:
    name: ACS Sensors (Crossref)
    issn: 2379-3694
    max_results: 40
    days: 30
- kind: rss
  weight: 0.9
  config:
    name: Lab on a Chip
    url: http://feeds.rsc.org/rss/lc
