# InterestProfile 种子（第 5 节）。这是"精华"筛选的大脑配置——数据，不写死。
#
# 2026-08 起所有推送只发公司群，行业类订阅统一用下面第 3 个「竞对窄口径」画像。
# 第 1 个宽口径画像（含泛半导体上下游）保留但不再挂订阅——想恢复宽口径时，把
# seed/load.py 里行业订阅的 profile_name 改回来即可。
- name: 超薄 SiN 膜 / 微纳芯片平台
  description: >
    聚焦"超薄 SiN 悬空膜微纳芯片平台"及其相关上下游产业链的产业情报雷达。
    核心：TEM/电镜支持膜耗材、in-situ/液体池 TEM、cryo-EM 载网、X-ray 窗、
    EV/外泌体/液体活检膜、固态纳米孔、微纳代工/MPW、电镜国产替代政策与采购线索。
    上游（也纳入）：半导体制造/晶圆代工、薄膜沉积(LPCVD/PECVD/ALD)、
    光刻/刻蚀/晶圆键合、MEMS 代工与工艺、关键材料(氮化硅/硅/前驱体)与设备。
    下游（也纳入）：基因/纳米孔测序、冷冻电镜与生命科学工具、X 射线/光子探测、
    生物传感/体外诊断、微流控、环境与颗粒物检测、过滤/分离膜应用。
  keywords:
    - 超薄 SiN 膜
    - TEM/电镜 支持膜耗材
    - in-situ/液体池 TEM
    - cryo-EM 载网
    - X-ray 窗
    - EV/外泌体/液体活检膜
    - 固态纳米孔(watch)
    - 微纳代工/MPW
    - 电镜国产替代政策与采购
    # 上游产业链
    - 半导体制造/晶圆代工
    - 薄膜沉积 LPCVD/PECVD/ALD
    - 光刻/刻蚀/晶圆键合
    - MEMS 代工与工艺
    - 半导体材料与设备
    # 下游应用
    - 基因/纳米孔测序
    - 冷冻电镜/生命科学工具
    - X射线/光子探测器
    - 生物传感/体外诊断
    - 微流控
    - 环境/颗粒物检测
    - 过滤/分离膜
    # 竞品监控
    - CleanSin
    - 港湾半导体
    - Norcada
    - Ted Pella
    - EMS
    - Quantifoil
    - SiMPore
    - Amptek
    - Moxtek
    - DENSsolutions
    - Protochips
  must_have:
    - 与"超薄膜/电镜耗材/微纳芯片平台，或其上下游产业链(半导体制造·薄膜·MEMS·材料设备 / 测序·电镜·探测器·传感·微流控)"相关
  exclude:
    - 与微纳制造/膜/传感/电镜均无关的纯数字 IC/EDA 设计
    - 与微纳制造/膜/传感均无关的纯消费电子终端
    - 周边配件类耗材（载网储存盒/镊子/夹持块/样品柜等），不涉及膜或工艺本身
    - 无实质信息的产品目录首页/分类页（只有品类名与站名，没有具体规格、型号或动向）
  notes: >
    行业源每条带"行动/关注"标签；行动项加一句 ≤25 字 "这对你意味着什么"。
    上下游已放宽，但仍以"与本产业链相关"为界，避免泛化成通用科技新闻。

# name 保留历史值（seed/load.py 按它查，且 summarize 的 prompt 只用
# description/keywords/must_have/exclude、不用 name）。2026-08-10 口径已放宽：
# 只盯固态纳米孔时，工作日常常一篇新论文都没有（实测 arXiv/PubMed 单日新增 0 条），
# 扩到纳米孔 / 纳米流控 / 单分子传感 / 悬空膜与孔的制造表征这一圈。
- name: 固态纳米孔
  description: >
    纳米孔与单分子传感研究雷达：新进展 + 经典精华。覆盖固态/生物纳米孔、纳米流控与
    离子输运、单分子与单颗粒传感、以及支撑它们的悬空薄膜与孔的制造表征。
    优先级最高：制造工艺 / 可制造性 / 传感应用 / 小批量验证。
  keywords:
    - solid-state nanopore
    - biological nanopore (MspA / aerolysin / CsgG / alpha-hemolysin)
    - 2D-material nanopore (MoS2/graphene/hBN)
    - nanopore fabrication (controlled dielectric breakdown / TEM drilling / ion-beam / laser)
    - nanofluidics / nanochannel / ionic transport / iontronics
    - single-molecule sensing (DNA / RNA / protein / peptide / glycan)
    - single-particle & resistive-pulse sensing
    - DNA/protein sequencing
    - ionic current sensing
    - nanopore + machine learning
    - freestanding / suspended membrane (SiN, SiO2, Si) fabrication
    - membrane thinning / TEM window / nanopore chip integration
    - single-entity electrochemistry
  must_have:
    - 与"纳米孔 / 纳米流控 / 单分子或单颗粒传感 / 悬空膜与孔的制造表征"之一直接相关
  exclude:
    - 纯临床或纯生物学研究，不涉及孔、通道、膜器件或单分子测量手段
    - 纯计算材料学（能带/催化/储能），与孔道输运或传感无关
    - 纳米颗粒合成/药物递送等，不涉及孔、膜或单分子测量
  notes: 经典论文走 classics_nanopore.yaml 人工种子 + S2 高引用兜底，每期轮换 1 篇。

# 公司群的「窄口径」：只看竞对动向 + 本业，刻意不覆盖泛半导体上下游。
# 行业日报与行业周报都用它。关键词已覆盖上面宽口径画像里所有"本业相关"条目，
# 合并后没有内容损失——少掉的只是刻意排除的泛半导体上下游新闻。
- name: 超薄 SiN 膜竞对 (公司群)
  description: >
    公司群用的「竞对 + 本业」窄口径雷达：只看下列竞对公司的动向（新品/产能/合作/
    价格/人事/客户案例），以及与超薄 SiN 悬空膜本业直接相关的内容：TEM/电镜支持膜
    耗材、in-situ/液体池 TEM、cryo-EM 载网、X-ray 窗、EV/外泌体/液体活检膜、
    固态纳米孔、微纳代工/MPW、电镜国产替代政策与采购线索。
    刻意不覆盖泛半导体产业新闻（先进制程/封装/EDA/IC 设计等）与无关上下游。
  keywords:
    # 竞对公司（核心关注对象）
    - CleanSin
    - 港湾半导体
    - Norcada
    - Ted Pella
    - EMS
    - Quantifoil
    - SiMPore
    - Amptek
    - Moxtek
    - DENSsolutions
    - Protochips
    # 本业直接相关
    - 超薄 SiN 膜
    - TEM/电镜 支持膜耗材
    - in-situ/液体池 TEM
    - cryo-EM 载网
    - X-ray 窗
    - EV/外泌体/液体活检膜
    - 固态纳米孔(watch)
    - 微纳代工/MPW
    - 电镜国产替代政策与采购
  must_have:
    - 与"上述竞对公司的动向"或"超薄膜/电镜耗材/载网/X-ray 窗/纳米孔本业产品"直接相关
  exclude:
    - 泛半导体产业新闻（晶圆代工/先进制程/封装/EDA/IC 设计/消费电子），除非直接涉及上述竞对或本业膜产品
    - 与膜无关的 MEMS（麦克风/IMU/微镜）除非涉及本业工艺或产能
    - 与本业无直接关系的上下游产业动态
    - 周边配件类耗材（载网储存盒/镊子/夹持块/样品柜等），不涉及膜或工艺本身
    - 无实质信息的产品目录首页/分类页（只有品类名与站名，没有具体规格、型号或动向）
  notes: >
    行业源每条带"行动/关注"标签；行动项加一句 ≤25 字 "这对你意味着什么"。
    口径要窄——宁可少发，也不要泛半导体新闻。
