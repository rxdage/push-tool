# 两个 InterestProfile 种子（第 5 节）。这是"精华"筛选的大脑配置——数据，不写死。
- name: 超薄 SiN 膜 / 微纳芯片平台
  description: >
    聚焦"超薄 SiN 悬空膜微纳芯片平台"及其相关上下游产业链的产业情报雷达。
    核心：TEM/电镜支持膜耗材、in-situ/液体池 TEM、cryo-EM 载网、X-ray 窗、
    EV/外泌体/液体活检膜、固态纳米孔、微纳代工/MPW、电镜国产替代政策与采购线索。
    上游（也纳入）：半导体制造/晶圆代工、薄膜沉积(LPCVD/PECVD/ALD)、
    光刻/刻蚀/晶圆键合、MEMS 代工与工艺、关键材料(氮化硅/硅/前驱体)与设备。
    下游（也纳入）：基因/纳米孔测序、冷冻电镜与生命科学工具、X 射线/光子探测、
    生物传感/体外诊断、微流控、环境与颗粒物检测、过滤/分离膜应用。
  keywords:
    - 超薄 SiN 膜
    - TEM/电镜 支持膜耗材
    - in-situ/液体池 TEM
    - cryo-EM 载网
    - X-ray 窗
    - EV/外泌体/液体活检膜
    - 固态纳米孔(watch)
    - 微纳代工/MPW
    - 电镜国产替代政策与采购
    # 上游产业链
    - 半导体制造/晶圆代工
    - 薄膜沉积 LPCVD/PECVD/ALD
    - 光刻/刻蚀/晶圆键合
    - MEMS 代工与工艺
    - 半导体材料与设备
    # 下游应用
    - 基因/纳米孔测序
    - 冷冻电镜/生命科学工具
    - X射线/光子探测器
    - 生物传感/体外诊断
    - 微流控
    - 环境/颗粒物检测
    - 过滤/分离膜
    # 竞品监控
    - CleanSin
    - 港湾半导体
    - Norcada
    - Ted Pella
    - EMS
    - Quantifoil
    - SiMPore
    - Amptek
    - Moxtek
    - DENSsolutions
    - Protochips
  must_have:
    - 与"超薄膜/电镜耗材/微纳芯片平台，或其上下游产业链(半导体制造·薄膜·MEMS·材料设备 / 测序·电镜·探测器·传感·微流控)"相关
  exclude:
    - 与微纳制造/膜/传感/电镜均无关的纯数字 IC/EDA 设计
    - 与微纳制造/膜/传感均无关的纯消费电子终端
  notes: >
    行业源每条带"行动/关注"标签；行动项加一句 ≤25 字 "这对你意味着什么"。
    上下游已放宽，但仍以"与本产业链相关"为界，避免泛化成通用科技新闻。

- name: 固态纳米孔
  description: >
    固态纳米孔（solid-state nanopore）研究雷达：新进展 + 经典精华。
    优先级最高：制造工艺 / 可制造性 / 传感应用 / 小批量验证。
  keywords:
    - solid-state nanopore
    - 2D-material nanopore (MoS2/graphene/hBN)
    - nanopore fabrication (controlled dielectric breakdown / TEM drilling / ion-beam)
    - DNA/protein sequencing
    - ionic current sensing
    - nanopore + machine learning
  must_have:
    - 制造工艺
    - 可制造性
    - 传感应用
    - 小批量验证
  exclude: []
  notes: 经典论文走 classics_nanopore.yaml 人工种子 + S2 高引用兜底，每周轮换 1-2 篇。
