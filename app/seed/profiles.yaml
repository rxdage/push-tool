    - 周边配件类耗材（载网储存盒/镊子/夹持块/样品柜等），不涉及膜或工艺本身
    - 无实质信息的产品目录首页/分类页（只有品类名与站名，没有具体规格、型号或动向）
  notes: >
    行业源每条带"行动/关注"标签；行动项加一句 ≤25 字 "这对你意味着什么"。
    公司群口径要窄——宁可少发，也不要泛半导体新闻。
