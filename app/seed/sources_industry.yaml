# Google News 关键词搜索源：实测比公司官网/泛半导体博客更新更频繁、且精准命中本业
# 关键词（不需要再靠站内关键词过滤，query 本身已限定话题）。
# 排除学术期刊/预印本/社交问答域名——不排除的话结果几乎全是 Nature 论文标题（实测
# 24/46），行业日报会读起来像学术周报的翻版；排除后才是供应商产品页/行业动态那类真正
# 的"行业"内容。
#
# ⚠️ 两个实测踩过的坑，改这条 query 前务必知道：
#   1. Google News 只认前约 10 个 -site:，之后的会被静默丢弃（不报错、看着像生效了）。
#      所以这里严格控制在 10 个，且按实测出现频次排优先级，不要随手往后加。
#   2. 要用顶级域，别用子域：写 pubs.acs.org 挡不住 ACS 的论文，写 acs.org 才行。
# max_results 限量：避免这一个源的候选量（常 100 条）把候选池灌满、挤掉其它十几个源。
- kind: rss
  weight: 1.1
  config:
    name: Google News (SiN膜/TEM/纳米孔关键词)
    url: "https://news.google.com/rss/search?q=%22silicon+nitride+membrane%22+OR+%22TEM+grid%22+OR+%22nanopore+fabrication%22+OR+%22cryo-EM+grid%22+-site:nature.com+-site:ncbi.nlm.nih.gov+-site:researchgate.net+-site:youtube.com+-site:acs.org+-site:wiley.com+-site:sciencedirect.com+-site:science.org+-site:springer.com+-site:instagram.com&hl=en-US&gl=US&ceid=US:en"
    max_results: 20

