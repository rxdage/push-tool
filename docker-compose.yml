services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: push
      POSTGRES_PASSWORD: push
      POSTGRES_DB: pushtool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U push -d pushtool"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - model_cache:/root/.cache  # 缓存本地嵌入模型权重
    # 启动前跑迁移，再起 web
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    volumes:
      - ./:/app
      - model_cache:/root/.cache
    # 每订阅一个 tz-aware cron job：抓取 → 筛选 → 投递
    command: ["python", "-m", "app.scheduler"]

  # 飞书问答 bot（默认不启动；填好 FEISHU_APP_ID/SECRET 后用：
  #   docker compose --profile qa up -d qa-bot）
  qa-bot:
    build: .
    restart: unless-stopped
    env_file: .env
    profiles: ["qa"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/app
      - model_cache:/root/.cache
    command: ["python", "-m", "app.delivery.feishu_qa_bot"]

volumes:
  pgdata:
  model_cache:
